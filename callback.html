<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDR Extension - Autenticando...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { text-align: center; padding: 40px; max-width: 500px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
        .token-box { background: #1e293b; padding: 15px; border-radius: 8px; margin: 20px 0; word-break: break-all; font-size: 12px; text-align: left; }
        button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin: 5px; }
        button:hover { background: #2563eb; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h2 id="status">Autenticando...</h2>
        <p id="message">Processando seu login na extensao SDR.</p>
        <div id="token-section" class="hidden">
            <p>Se o login nao foi automatico, copie o token abaixo e cole na extensao:</p>
            <div class="token-box" id="token-display"></div>
            <button onclick="copyToken()">Copiar Token</button>
        </div>
        <div id="close-section" class="hidden">
            <button onclick="window.close()">Fechar aba</button>
        </div>
    </div>
    <script>
        // SDR Extension ID - Chrome Web Store ID (fixed)
        // For development, the extension ID is generated from the key in manifest
        // We need to try multiple extension IDs
        const EXTENSION_IDS = [
            // Development ID (will be different for each machine)
            // User needs to check chrome://extensions for the actual ID
            "mebmjkiogjhnjkljjjfoinbpefjbbpno", // Placeholder - needs to be updated
        ];
        
        // Parse both query string (for extension_id) and hash (for tokens)
        const searchParams = new URLSearchParams(window.location.search);
        const hash = window.location.hash.substring(1);
        const hashParams = new URLSearchParams(hash);
        
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');
        const error = hashParams.get('error');
        const errorDescription = hashParams.get('error_description');
        const extensionIdFromUrl = searchParams.get('extension_id');
        
        const statusEl = document.getElementById('status');
        const messageEl = document.getElementById('message');
        const spinnerEl = document.getElementById('spinner');
        const tokenSection = document.getElementById('token-section');
        const tokenDisplay = document.getElementById('token-display');
        const closeSection = document.getElementById('close-section');
        
        let sessionData = null;
        
        if (error) {
            spinnerEl.classList.add('hidden');
            statusEl.textContent = 'Erro na autenticacao';
            statusEl.className = 'error';
            messageEl.textContent = errorDescription || error;
        } else if (accessToken) {
            sessionData = {
                access_token: accessToken,
                refresh_token: refreshToken,
                token_type: 'bearer',
                expires_in: 3600
            };
            
            // Store in localStorage as backup
            localStorage.setItem('supabase.auth.token', JSON.stringify(sessionData));
            
            // Build list of extension IDs to try
            const idsToTry = extensionIdFromUrl 
                ? [extensionIdFromUrl, ...EXTENSION_IDS] 
                : EXTENSION_IDS;
            
            // Try to send to extension via external messaging
            trySendToExtension(idsToTry, 0);
        } else {
            spinnerEl.classList.add('hidden');
            statusEl.textContent = 'Nenhum token encontrado';
            statusEl.className = 'error';
            messageEl.textContent = 'O link de autenticacao parece estar incompleto.';
        }
        
        function trySendToExtension(ids, index) {
            if (index >= ids.length) {
                // All IDs failed, show manual token
                showManualToken();
                return;
            }
            
            const extensionId = ids[index];
            
            // Check if chrome.runtime is available (we're in a browser context)
            if (typeof chrome === 'undefined' || !chrome.runtime) {
                console.log('Chrome runtime not available');
                showManualToken();
                return;
            }
            
            try {
                chrome.runtime.sendMessage(
                    extensionId,
                    {
                        type: 'AUTH_TOKEN',
                        access_token: sessionData.access_token,
                        refresh_token: sessionData.refresh_token
                    },
                    function(response) {
                        if (chrome.runtime.lastError) {
                            console.log('Failed for ID', extensionId, ':', chrome.runtime.lastError.message);
                            // Try next ID
                            trySendToExtension(ids, index + 1);
                        } else if (response && response.success) {
                            showSuccess();
                        } else {
                            console.log('Unexpected response:', response);
                            trySendToExtension(ids, index + 1);
                        }
                    }
                );
            } catch (e) {
                console.log('Exception for ID', extensionId, ':', e);
                trySendToExtension(ids, index + 1);
            }
        }
        
        function showSuccess() {
            spinnerEl.classList.add('hidden');
            statusEl.textContent = 'Login realizado com sucesso!';
            statusEl.className = 'success';
            messageEl.innerHTML = 'Voce pode fechar esta aba e voltar para a extensao.';
            closeSection.classList.remove('hidden');
            
            // Auto-close after 2 seconds
            setTimeout(() => {
                window.close();
            }, 2000);
        }
        
        function showManualToken() {
            spinnerEl.classList.add('hidden');
            statusEl.textContent = 'Login realizado!';
            statusEl.className = 'success';
            messageEl.innerHTML = 'A extensao nao detectou automaticamente. Use o token abaixo:';
            tokenSection.classList.remove('hidden');
            tokenDisplay.textContent = JSON.stringify(sessionData);
        }
        
        function copyToken() {
            navigator.clipboard.writeText(JSON.stringify(sessionData)).then(() => {
                alert('Token copiado! Cole na extensao.');
            });
        }
    </script>
</body>
</html>
