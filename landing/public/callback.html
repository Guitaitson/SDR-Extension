<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDR Extension — Autenticando…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #1e293b;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    p  { font-size: 15px; color: #94a3b8; line-height: 1.6; }
    .success h1 { color: #22c55e; }
    .error   h1 { color: #f87171; }
    .token-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px;
      margin: 20px 0;
      word-break: break-all;
      font-size: 11px;
      font-family: monospace;
      text-align: left;
      color: #94a3b8;
    }
    .btn {
      display: inline-block;
      padding: 10px 22px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-top: 8px;
    }
    .btn:hover { background: #1d4ed8; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card" id="root">
    <div class="spinner" id="spinner"></div>
    <h1 id="status">Autenticando…</h1>
    <p  id="message">Processando seu login na extensão SDR.</p>

    <div id="token-section" class="hidden">
      <p>Se o login não foi automático, copie o token abaixo e cole na extensão:</p>
      <div class="token-box" id="token-display"></div>
      <button class="btn" onclick="copyToken()">Copiar token</button>
    </div>

    <div id="close-section" class="hidden">
      <button class="btn" onclick="window.close()">Fechar aba</button>
    </div>
  </div>

  <script>
    var sessionData = null;

    var searchParams  = new URLSearchParams(window.location.search);
    var hash          = window.location.hash.substring(1);
    var hashParams    = new URLSearchParams(hash);

    var accessToken       = hashParams.get('access_token');
    var refreshToken      = hashParams.get('refresh_token');
    var errorCode         = hashParams.get('error');
    var errorDescription  = hashParams.get('error_description');
    var extensionIdFromUrl = searchParams.get('extension_id');

    var statusEl      = document.getElementById('status');
    var messageEl     = document.getElementById('message');
    var spinnerEl     = document.getElementById('spinner');
    var tokenSection  = document.getElementById('token-section');
    var tokenDisplay  = document.getElementById('token-display');
    var closeSection  = document.getElementById('close-section');
    var rootEl        = document.getElementById('root');

    function hide(el)   { el.classList.add('hidden'); }
    function show(el)   { el.classList.remove('hidden'); }
    function setClass(cls) { rootEl.className = 'card ' + cls; }

    if (errorCode) {
      hide(spinnerEl);
      statusEl.textContent  = 'Erro na autenticação';
      messageEl.textContent = errorDescription || errorCode;
      setClass('error');

    } else if (accessToken) {
      sessionData = {
        access_token:  accessToken,
        refresh_token: refreshToken,
        token_type:    'bearer',
        expires_in:    3600,
      };

      // Fallback: store in localStorage so the extension can read it
      try { localStorage.setItem('sdr_auth_token', JSON.stringify(sessionData)); } catch (_) {}

      // Build list of extension IDs to try (dynamic ID from URL param first)
      var idsToTry = extensionIdFromUrl ? [extensionIdFromUrl] : [];

      trySendToExtension(idsToTry, 0);

    } else {
      hide(spinnerEl);
      statusEl.textContent  = 'Nenhum token encontrado';
      messageEl.textContent = 'O link de autenticação parece estar incompleto. Tente novamente.';
      setClass('error');
    }

    function trySendToExtension(ids, index) {
      if (index >= ids.length) {
        showManualToken();
        return;
      }

      var extensionId = ids[index];

      if (typeof chrome === 'undefined' || !chrome.runtime || !chrome.runtime.sendMessage) {
        showManualToken();
        return;
      }

      try {
        chrome.runtime.sendMessage(
          extensionId,
          { type: 'AUTH_TOKEN', access_token: sessionData.access_token, refresh_token: sessionData.refresh_token },
          function (response) {
            if (chrome.runtime.lastError) {
              console.warn('[callback] ID', extensionId, ':', chrome.runtime.lastError.message);
              trySendToExtension(ids, index + 1);
            } else if (response && response.success) {
              showSuccess();
            } else {
              trySendToExtension(ids, index + 1);
            }
          }
        );
      } catch (e) {
        console.warn('[callback] Exception for ID', extensionId, ':', e);
        trySendToExtension(ids, index + 1);
      }
    }

    function showSuccess() {
      hide(spinnerEl);
      statusEl.textContent  = 'Login realizado com sucesso!';
      messageEl.textContent = 'Você pode fechar esta aba e voltar à extensão.';
      setClass('success');
      show(closeSection);
      setTimeout(function () { try { window.close(); } catch (_) {} }, 2000);
    }

    function showManualToken() {
      hide(spinnerEl);
      statusEl.textContent  = 'Login realizado!';
      messageEl.textContent = 'A extensão não foi detectada automaticamente. Copie o token abaixo e cole na extensão.';
      tokenDisplay.textContent = JSON.stringify(sessionData, null, 2);
      setClass('success');
      show(tokenSection);
    }

    function copyToken() {
      navigator.clipboard.writeText(JSON.stringify(sessionData))
        .then(function () { alert('Token copiado! Cole na extensão.'); })
        .catch(function () {
          // Fallback for older browsers
          var el = document.createElement('textarea');
          el.value = JSON.stringify(sessionData);
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);
          alert('Token copiado!');
        });
    }
  </script>
</body>
</html>
