# Supabase project configuration
# See https://supabase.com/docs/reference/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[ingest]
enabled = false

[storage]
enabled = false  # Not needed for this project

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["chrome-extension://*"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false  # Magic link only — no confirmation needed

[functions]
# Deploy all functions in supabase/functions/
verify_jwt = true

[analytics]
enabled = false
