# nginx config for sellhelper.gtaitson.space
# Setup:
#   sudo cp nginx-sellhelper.conf /etc/nginx/sites-available/sellhelper.gtaitson.space
#   sudo ln -s /etc/nginx/sites-available/sellhelper.gtaitson.space /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d sellhelper.gtaitson.space
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP: redirect all traffic to HTTPS ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sellhelper.gtaitson.space;

    # Let's Encrypt ACME challenge (certbot uses this before issuing cert)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: serve static Next.js export ───────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sellhelper.gtaitson.space;

    # SSL managed by certbot — paths filled automatically after: certbot --nginx
    ssl_certificate     /etc/letsencrypt/live/sellhelper.gtaitson.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sellhelper.gtaitson.space/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Static export is in landing/out/ → deployed to this directory
    root  /var/www/sellhelper.gtaitson.space/out;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Static assets: immutable long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML: no-cache so redeploys propagate immediately
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Next.js static export routing: try file → directory → .html suffix
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Block dot-files
    location ~ /\. {
        deny all;
    }
}
